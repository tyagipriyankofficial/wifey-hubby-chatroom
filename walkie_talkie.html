<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Walkie Talkie">
<meta name="theme-color" content="#0f1115">
<title>Walkie Talkie</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #8a8f9a;
    --accent: #4f8cff;
    --accent-hover: #3f78e8;
    --success: #3ecf8e;
    --danger: #e5534b;
    --bubble-me: #2c5fd9;
    --bubble-them: #1f232b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%; max-width: 480px; display: flex; flex-direction: column;
    height: 100vh; height: 100svh;
  }

  /* Setup screen */
  #setupScreen { padding: max(24px, env(safe-area-inset-top)) 16px 24px; overflow-y: auto; }
  #setupScreen h1 { font-size: 20px; margin: 0 0 4px; }
  #setupScreen .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type="text"], select {
    width: 100%; background: #10131a; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; color: var(--text); font-size: 16px; margin-bottom: 12px;
    touch-action: manipulation;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); border: none; border-radius: 8px; padding: 13px; color: white;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; touch-action: manipulation;
  }
  button:hover { background: var(--accent-hover); }
  button:active { background: var(--accent-hover); transform: scale(0.98); }
  button:disabled { background: #333844; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 12px; }

  /* Chat screen */
  #chatScreen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); background: var(--panel);
    flex-shrink: 0;
  }
  .backBtn {
    width: auto; background: transparent; padding: 4px 6px 4px 0;
    font-size: 22px; line-height: 1; color: var(--text); font-weight: 400;
  }
  .backBtn:hover, .backBtn:active { background: transparent; transform: none; color: var(--accent); }
  .headerInfo { flex: 1; min-width: 0; }
  .header .title { font-size: 15px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .dot.connected { background: var(--success); }
  #messages {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .bubble-row { display: flex; }
  .bubble-row.me { justify-content: flex-end; }
  .bubble-row.them { justify-content: flex-start; }
  .bubble { max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: 15px; word-break: break-word; }
  .bubble-row.me .bubble { background: var(--bubble-me); border-bottom-right-radius: 4px; }
  .bubble-row.them .bubble { background: var(--bubble-them); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble .time { display: block; font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 3px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
  .inputRow {
    display: flex; gap: 8px; padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--panel);
    flex-shrink: 0;
  }
  .inputRow input {
    margin: 0; flex: 1; font-size: 16px; padding: 12px;
    background: #10131a; border: 1px solid var(--border); border-radius: 20px;
    color: var(--text); touch-action: manipulation;
  }
  .inputRow input:focus { outline: none; border-color: var(--accent); }
  .inputRow button { width: auto; padding: 10px 18px; border-radius: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- SETUP SCREEN -->
  <div id="setupScreen">
    <h1>Walkie Talkie</h1>
    <div class="subtitle">Private two-person chat.</div>
    <div class="panel">
      <label for="whoAmI">Who are you?</label>
      <select id="whoAmI">
        <option value="">Select...</option>
        <option value="priyank">Priyank</option>
        <option value="akshaya">Akshaya</option>
      </select>

      <label for="roomCode">Room code (same on both phones)</label>
      <input type="text" id="roomCode" placeholder="e.g. a private word only you two know">
      <div class="hint">This is not a real password — anyone who knows this code and your database rules could join. Fine for a practice project; we'll lock it down properly later.</div>

      <button id="enterBtn">Enter chat</button>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="header">
      <button class="backBtn" id="backBtn" aria-label="Back">‹</button>
      <div class="headerInfo">
        <div class="title" id="roomTitle">Room</div>
        <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Connecting…</span></div>
      </div>
    </div>
    <div id="messages"><div class="empty">No messages yet — say hi 👋</div></div>
    <div class="inputRow">
      <input type="text" id="messageInput" placeholder="Message..." autocomplete="off" autocorrect="on">
      <button id="sendBtn">Send</button>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, query, limitToLast
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCABDbvRhjoKzzehoH9LEhRvLi9DPz_8cE",
    authDomain: "walkie-takie.firebaseapp.com",
    databaseURL: "https://walkie-takie-default-rtdb.firebaseio.com",
    projectId: "walkie-takie",
    storageBucket: "walkie-takie.firebasestorage.app",
    messagingSenderId: "819211973159",
    appId: "1:819211973159:web:7aeb70b01aa99fc7039402"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const setupScreen = document.getElementById("setupScreen");
  const chatScreen = document.getElementById("chatScreen");
  const whoAmI = document.getElementById("whoAmI");
  const roomCode = document.getElementById("roomCode");
  const enterBtn = document.getElementById("enterBtn");
  const backBtn = document.getElementById("backBtn");
  const roomTitle = document.getElementById("roomTitle");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const messagesEl = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  whoAmI.value = localStorage.getItem("walkieWho") || "";
  roomCode.value = localStorage.getItem("walkieRoom") || "";

  let myIdentity = null;
  let messagesRef = null;
  let unsubConnected = null;
  let unsubMessages = null;
  let isInitialLoad = true;
  let lastSeenTimestamp = 0;

  enterBtn.addEventListener("click", enterChat);
  backBtn.addEventListener("click", leaveChat);

  function enterChat() {
    const who = whoAmI.value;
    const room = roomCode.value.trim();
    if (!who || !room) {
      alert("Pick who you are and enter a room code.");
      return;
    }
    localStorage.setItem("walkieWho", who);
    localStorage.setItem("walkieRoom", room);
    myIdentity = who;

    // Ask for notification permission right as they enter — this needs to
    // happen from a direct user tap, browsers block silent auto-requests.
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    const safeRoom = room.toLowerCase().replace(/[^a-z0-9]/g, "-");
    messagesRef = ref(db, `walkie/${safeRoom}/messages`);
    roomTitle.textContent = `Room: ${room}`;

    isInitialLoad = true;
    lastSeenTimestamp = 0;
    messagesEl.innerHTML = '<div class="empty">No messages yet — say hi 👋</div>';

    setupScreen.style.display = "none";
    chatScreen.style.display = "flex";

    startListeners();
    messageInput.focus();
  }

  function leaveChat() {
    // Detach Firebase listeners so re-entering doesn't stack duplicates
    if (unsubConnected) unsubConnected();
    if (unsubMessages) unsubMessages();
    unsubConnected = null;
    unsubMessages = null;
    messagesRef = null;

    chatScreen.style.display = "none";
    setupScreen.style.display = "block";
    statusText.textContent = "Connecting…";
    statusDot.classList.remove("connected");
  }

  function startListeners() {
    const connectedRef = ref(db, ".info/connected");
    unsubConnected = onValue(connectedRef, (snap) => {
      const connected = snap.val() === true;
      statusDot.classList.toggle("connected", connected);
      statusText.textContent = connected ? "Live" : "Connecting…";
    });

    const recentQuery = query(messagesRef, limitToLast(200));
    unsubMessages = onValue(recentQuery, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        messagesEl.innerHTML = '<div class="empty">No messages yet — say hi 👋</div>';
        isInitialLoad = false;
        return;
      }
      const entries = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

      messagesEl.innerHTML = entries.map(e => {
        const side = e.from === myIdentity ? "me" : "them";
        const time = new Date(e.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        return `
          <div class="bubble-row ${side}">
            <div class="bubble">${escapeHtml(e.text)}<span class="time">${time}</span></div>
          </div>`;
      }).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;

      // Notify only for genuinely new messages from the other person —
      // never on the initial history load when you first open the room.
      if (!isInitialLoad) {
        const newOnes = entries.filter(e => e.timestamp > lastSeenTimestamp && e.from !== myIdentity);
        newOnes.forEach(notifyNewMessage);
      }
      if (entries.length) {
        lastSeenTimestamp = entries[entries.length - 1].timestamp;
      }
      isInitialLoad = false;
    });
  }

  function notifyNewMessage(entry) {
    const senderName = entry.from === "priyank" ? "Priyank" : "Akshaya";

    if (navigator.vibrate) navigator.vibrate(200);

    if ("Notification" in window && Notification.permission === "granted") {
      try {
        const n = new Notification(senderName, { body: entry.text, tag: "walkie-msg" });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (err) {
        // Some mobile browsers only allow notifications via a service worker;
        // vibration above still gives a signal even if this fails silently.
      }
    }
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !messagesRef) return;
    sendBtn.disabled = true;
    try {
      await push(messagesRef, { text, from: myIdentity, timestamp: Date.now() });
      messageInput.value = "";
    } catch (err) {
      alert("Send failed: " + err.message);
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
