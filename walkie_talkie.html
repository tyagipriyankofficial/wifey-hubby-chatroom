<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walkie Talkie</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #8a8f9a;
    --accent: #4f8cff;
    --accent-hover: #3f78e8;
    --success: #3ecf8e;
    --danger: #e5534b;
    --bubble-me: #2c5fd9;
    --bubble-them: #1f232b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100vh; }

  /* Setup screen */
  #setupScreen { padding: 24px 16px; }
  #setupScreen h1 { font-size: 20px; margin: 0 0 4px; }
  #setupScreen .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type="text"], select {
    width: 100%; background: #10131a; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 12px;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); border: none; border-radius: 8px; padding: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #333844; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 12px; }

  /* Chat screen */
  #chatScreen { display: none; flex-direction: column; height: 100vh; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .header .title { font-size: 15px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .dot.connected { background: var(--success); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble-row { display: flex; }
  .bubble-row.me { justify-content: flex-end; }
  .bubble-row.them { justify-content: flex-start; }
  .bubble {
    max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: 14px; word-break: break-word;
  }
  .bubble-row.me .bubble { background: var(--bubble-me); border-bottom-right-radius: 4px; }
  .bubble-row.them .bubble { background: var(--bubble-them); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble .time { display: block; font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 3px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
  .inputRow { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  .inputRow input { margin: 0; flex: 1; }
  .inputRow button { width: auto; padding: 10px 18px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- SETUP SCREEN -->
  <div id="setupScreen">
    <h1>Walkie Talkie</h1>
    <div class="subtitle">Private two-person chat.</div>
    <div class="panel">
      <label for="whoAmI">Who are you?</label>
      <select id="whoAmI">
        <option value="">Select...</option>
        <option value="priyank">Priyank</option>
        <option value="akshaya">Akshaya</option>
      </select>

      <label for="roomCode">Room code (same on both phones)</label>
      <input type="text" id="roomCode" placeholder="e.g. a private word only you two know">
      <div class="hint">This is not a real password — anyone who knows this code and your database rules could join. Fine for a practice project; we'll lock it down properly later.</div>

      <button id="enterBtn">Enter chat</button>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="header">
      <div class="title" id="roomTitle">Room</div>
      <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Connecting…</span></div>
    </div>
    <div id="messages"><div class="empty">No messages yet — say hi 👋</div></div>
    <div class="inputRow">
      <input type="text" id="messageInput" placeholder="Message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, query, limitToLast
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // ====================================================================
  // PASTE YOUR firebaseConfig HERE (same one from the sync test app —
  // you can reuse the same Firebase project)
  // ====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCABDbvRhjoKzzehoH9LEhRvLi9DPz_8cE",
    authDomain: "walkie-takie.firebaseapp.com",
    databaseURL: "https://walkie-takie-default-rtdb.firebaseio.com",
    projectId: "walkie-takie",
    storageBucket: "walkie-takie.firebasestorage.app",
    messagingSenderId: "819211973159",
    appId: "1:819211973159:web:7aeb70b01aa99fc7039402"
  };
  // ====================================================================

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const setupScreen = document.getElementById("setupScreen");
  const chatScreen = document.getElementById("chatScreen");
  const whoAmI = document.getElementById("whoAmI");
  const roomCode = document.getElementById("roomCode");
  const enterBtn = document.getElementById("enterBtn");
  const roomTitle = document.getElementById("roomTitle");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const messagesEl = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  // Remember identity + room locally so you don't re-enter every time
  whoAmI.value = localStorage.getItem("walkieWho") || "";
  roomCode.value = localStorage.getItem("walkieRoom") || "";

  let myIdentity = null;
  let messagesRef = null;

  enterBtn.addEventListener("click", enterChat);

  function enterChat() {
    const who = whoAmI.value;
    const room = roomCode.value.trim();
    if (!who || !room) {
      alert("Pick who you are and enter a room code.");
      return;
    }
    localStorage.setItem("walkieWho", who);
    localStorage.setItem("walkieRoom", room);
    myIdentity = who;

    const safeRoom = room.toLowerCase().replace(/[^a-z0-9]/g, "-");
    messagesRef = ref(db, `walkie/${safeRoom}/messages`);
    roomTitle.textContent = `Room: ${room}`;

    setupScreen.style.display = "none";
    chatScreen.style.display = "flex";

    startListeners();
    messageInput.focus();
  }

  function startListeners() {
    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      const connected = snap.val() === true;
      statusDot.classList.toggle("connected", connected);
      statusText.textContent = connected ? "Live" : "Connecting…";
    });

    const recentQuery = query(messagesRef, limitToLast(200));
    onValue(recentQuery, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        messagesEl.innerHTML = '<div class="empty">No messages yet — say hi 👋</div>';
        return;
      }
      const entries = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
      messagesEl.innerHTML = entries.map(e => {
        const side = e.from === myIdentity ? "me" : "them";
        const time = new Date(e.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        return `
          <div class="bubble-row ${side}">
            <div class="bubble">${escapeHtml(e.text)}<span class="time">${time}</span></div>
          </div>`;
      }).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !messagesRef) return;
    sendBtn.disabled = true;
    try {
      await push(messagesRef, { text, from: myIdentity, timestamp: Date.now() });
      messageInput.value = "";
    } catch (err) {
      alert("Send failed: " + err.message);
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
